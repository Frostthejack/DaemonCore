<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGradT" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f0a030"/>
    </radialGradient>
    <radialGradient id="bellyGradT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </radialGradient>
    <radialGradient id="eyeGradT" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0f0"/>
    </radialGradient>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="50" fill="url(#bodyGradT)"/>
  <ellipse cx="100" cy="140" rx="35" ry="35" fill="url(#bellyGradT)"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="45" fill="url(#bodyGradT)"/>

  <!-- Ear tufts -->
  <path d="M 65 38 Q 55 15 75 30 Q 78 35 72 42 Z" fill="#f0a030"/>
  <path d="M 135 38 Q 145 15 125 30 Q 122 35 128 42 Z" fill="#f0a030"/>
  <path d="M 68 40 Q 60 22 76 34 Z" fill="#ffb347"/>
  <path d="M 132 40 Q 140 22 124 34 Z" fill="#ffb347"/>

  <!-- Eye whites - looking up -->
  <ellipse cx="82" cy="70" rx="18" ry="19" fill="url(#eyeGradT)" stroke="#4a3f6b" stroke-width="1.5"/>
  <ellipse cx="118" cy="70" rx="18" ry="19" fill="url(#eyeGradT)" stroke="#4a3f6b" stroke-width="1.5"/>

  <!-- Pupils - looking up -->
  <circle cx="84" cy="66" r="9" fill="#2d2b55"/>
  <circle cx="120" cy="66" r="9" fill="#2d2b55"/>

  <!-- Eye highlights -->
  <circle cx="87" cy="62" r="4" fill="white" opacity="0.9"/>
  <circle cx="123" cy="62" r="4" fill="white" opacity="0.9"/>

  <!-- Raised eyebrows -->
  <path d="M 68 55 Q 82 48 96 55" fill="none" stroke="#4a3f6b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 104 55 Q 118 48 132 55" fill="none" stroke="#4a3f6b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Beak - slightly open -->
  <path d="M 93 86 L 100 96 L 107 86 Z" fill="#e08e3a" stroke="#d07a2a" stroke-width="1"/>
  <ellipse cx="100" cy="90" rx="4" ry="2" fill="#c06a1a" opacity="0.5"/>

  <!-- Wings -->
  <path d="M 50 115 Q 35 130 45 155 Q 55 145 60 130 Z" fill="#e09020" opacity="0.8"/>
  <path d="M 150 115 Q 165 130 155 155 Q 145 145 140 130 Z" fill="#e09020" opacity="0.8"/>

  <!-- Feet -->
  <path d="M 80 175 L 75 188 M 80 175 L 80 188 M 80 175 L 85 188" stroke="#e08e3a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 120 175 L 115 188 M 120 175 L 120 188 M 120 175 L 125 188" stroke="#e08e3a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Thought bubbles -->
  <circle cx="155" cy="35" r="6" fill="white" opacity="0.8" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="25" r="8" fill="white" opacity="0.7" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="178" cy="15" r="10" fill="white" opacity="0.6" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="185" cy="8" r="3" fill="white" opacity="0.5" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- Feather detail lines on belly -->
  <path d="M 85 130 Q 100 135 115 130" fill="none" stroke="#ffe0b2" stroke-width="1" opacity="0.5"/>
  <path d="M 82 140 Q 100 145 118 140" fill="none" stroke="#ffe0b2" stroke-width="1" opacity="0.5"/>
  <path d="M 85 150 Q 100 155 115 150" fill="none" stroke="#ffe0b2" stroke-width="1" opacity="0.5"/>
</svg>
