<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    .wing1 { animation: flap 0.5s infinite ease-in-out; transform-origin: 35px 85px; }
    .wing2 { animation: flap 0.5s infinite ease-in-out 0.25s; transform-origin: 115px 85px; }
  </style>
  <ellipse cx="75" cy="90" rx="45" ry="40" fill="#c070f0" opacity="0.9"/>
  <circle cx="75" cy="55" r="35" fill="#c070f0"/>
  <circle cx="62" cy="50" r="10" fill="white"/>
  <circle cx="64" cy="50" r="5" fill="#222"/>
  <circle cx="88" cy="50" r="10" fill="white"/>
  <circle cx="90" cy="50" r="5" fill="#222"/>
  <polygon points="75,58 70,68 80,68" fill="#f0a030"/>
  <ellipse cx="35" cy="85" rx="12" ry="20" fill="#c070f0" opacity="0.7" class="wing1"/>
  <ellipse cx="115" cy="85" rx="12" ry="20" fill="#c070f0" opacity="0.7" class="wing2"/>
  <ellipse cx="60" cy="128" rx="10" ry="5" fill="#f0a030"/>
  <ellipse cx="90" cy="128" rx="10" ry="5" fill="#f0a030"/>
</svg>
