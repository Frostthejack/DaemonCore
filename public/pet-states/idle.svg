<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9b8ff7"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0e6ff"/>
      <stop offset="100%" stop-color="#d4c8f0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0f0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="50" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Belly patch -->
  <ellipse cx="100" cy="140" rx="35" ry="35" fill="url(#bellyGrad)"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="45" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Ear tufts -->
  <path d="M 65 38 Q 55 15 75 30 Q 78 35 72 42 Z" fill="#6c5ce7"/>
  <path d="M 135 38 Q 145 15 125 30 Q 122 35 128 42 Z" fill="#6c5ce7"/>
  <path d="M 68 40 Q 60 22 76 34 Z" fill="#8b7ff0"/>
  <path d="M 132 40 Q 140 22 124 34 Z" fill="#8b7ff0"/>

  <!-- Eye whites - large cartoon eyes -->
  <ellipse cx="82" cy="72" rx="18" ry="19" fill="url(#eyeGrad)" stroke="#4a3f6b" stroke-width="1.5"/>
  <ellipse cx="118" cy="72" rx="18" ry="19" fill="url(#eyeGrad)" stroke="#4a3f6b" stroke-width="1.5"/>

  <!-- Pupils -->
  <circle cx="84" cy="73" r="9" fill="#2d2b55"/>
  <circle cx="120" cy="73" r="9" fill="#2d2b55"/>

  <!-- Eye highlights -->
  <circle cx="87" cy="69" r="4" fill="white" opacity="0.9"/>
  <circle cx="123" cy="69" r="4" fill="white" opacity="0.9"/>
  <circle cx="82" cy="76" r="2" fill="white" opacity="0.5"/>
  <circle cx="118" cy="76" r="2" fill="white" opacity="0.5"/>

  <!-- Beak -->
  <path d="M 93 88 L 100 100 L 107 88 Z" fill="#f4a261" stroke="#e08e3a" stroke-width="1"/>
  <path d="M 95 88 L 100 96 L 105 88" fill="none" stroke="#e08e3a" stroke-width="0.5" opacity="0.5"/>

  <!-- Wings -->
  <path d="M 50 115 Q 35 130 45 155 Q 55 145 60 130 Z" fill="#5a4fbf" opacity="0.8"/>
  <path d="M 150 115 Q 165 130 155 155 Q 145 145 140 130 Z" fill="#5a4fbf" opacity="0.8"/>
  <path d="M 52 118 Q 40 132 48 152" fill="none" stroke="#4a3f6b" stroke-width="1" opacity="0.4"/>
  <path d="M 148 118 Q 160 132 152 152" fill="none" stroke="#4a3f6b" stroke-width="1" opacity="0.4"/>

  <!-- Feet -->
  <path d="M 80 175 L 75 188 M 80 175 L 80 188 M 80 175 L 85 188" stroke="#f4a261" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 120 175 L 115 188 M 120 175 L 120 188 M 120 175 L 125 188" stroke="#f4a261" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Feather detail lines on belly -->
  <path d="M 85 130 Q 100 135 115 130" fill="none" stroke="#c4b8e0" stroke-width="1" opacity="0.5"/>
  <path d="M 82 140 Q 100 145 118 140" fill="none" stroke="#c4b8e0" stroke-width="1" opacity="0.5"/>
  <path d="M 85 150 Q 100 155 115 150" fill="none" stroke="#c4b8e0" stroke-width="1" opacity="0.5"/>

  <!-- Blush -->
  <ellipse cx="68" cy="85" rx="8" ry="5" fill="#ff9999" opacity="0.3"/>
  <ellipse cx="132" cy="85" rx="8" ry="5" fill="#ff9999" opacity="0.3"/>
</svg>
