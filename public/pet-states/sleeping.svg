<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes zzz {
      0% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 0.7; transform: translateY(-5px); }
      100% { opacity: 0.3; transform: translateY(0); }
    }
    .zzz1 { animation: zzz 2s infinite ease-in-out; }
    .zzz2 { animation: zzz 2s infinite ease-in-out 0.5s; }
    .zzz3 { animation: zzz 2s infinite ease-in-out 1s; }
  </style>
  <ellipse cx="75" cy="90" rx="45" ry="40" fill="#8080a0" opacity="0.9"/>
  <circle cx="75" cy="55" r="35" fill="#8080a0"/>
  <line x1="55" y1="50" x2="70" y2="50" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="95" y2="50" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <polygon points="75,58 70,68 80,68" fill="#f0a030"/>
  <ellipse cx="35" cy="85" rx="12" ry="20" fill="#8080a0" opacity="0.7"/>
  <ellipse cx="115" cy="85" rx="12" ry="20" fill="#8080a0" opacity="0.7"/>
  <ellipse cx="60" cy="128" rx="10" ry="5" fill="#f0a030"/>
  <ellipse cx="90" cy="128" rx="10" ry="5" fill="#f0a030"/>
  <text x="100" y="25" fontSize="14" fill="white" opacity="0.7" class="zzz1">Z</text>
  <text x="112" y="18" fontSize="10" fill="white" opacity="0.5" class="zzz2">z</text>
  <text x="120" y="12" fontSize="8" fill="white" opacity="0.3" class="zzz3">z</text>
</svg>
