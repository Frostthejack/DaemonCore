<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGradW" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5bb8f5"/>
      <stop offset="100%" stop-color="#30a0f0"/>
    </radialGradient>
    <radialGradient id="bellyGradW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#c8e0f8"/>
    </radialGradient>
    <radialGradient id="eyeGradW" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e8f0"/>
    </radialGradient>
  </defs>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="50" fill="url(#bodyGradW)"/>
  <ellipse cx="100" cy="140" rx="35" ry="35" fill="url(#bellyGradW)"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="45" fill="url(#bodyGradW)"/>

  <!-- Ear tufts -->
  <path d="M 65 38 Q 55 15 75 30 Q 78 35 72 42 Z" fill="#30a0f0"/>
  <path d="M 135 38 Q 145 15 125 30 Q 122 35 128 42 Z" fill="#30a0f0"/>
  <path d="M 68 40 Q 60 22 76 34 Z" fill="#5bb8f5"/>
  <path d="M 132 40 Q 140 22 124 34 Z" fill="#5bb8f5"/>

  <!-- Eye whites - focused look -->
  <ellipse cx="82" cy="72" rx="18" ry="19" fill="url(#eyeGradW)" stroke="#4a3f6b" stroke-width="1.5"/>
  <ellipse cx="118" cy="72" rx="18" ry="19" fill="url(#eyeGradW)" stroke="#4a3f6b" stroke-width="1.5"/>

  <!-- Pupils - looking slightly down at screen -->
  <circle cx="84" cy="76" r="9" fill="#2d2b55"/>
  <circle cx="120" cy="76" r="9" fill="#2d2b55"/>

  <!-- Eye highlights -->
  <circle cx="87" cy="72" r="4" fill="white" opacity="0.9"/>
  <circle cx="123" cy="72" r="4" fill="white" opacity="0.9"/>

  <!-- Focused eyebrows -->
  <path d="M 72 58 Q 82 54 92 58" fill="none" stroke="#2a5a8a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 58 Q 118 54 128 58" fill="none" stroke="#2a5a8a" stroke-width="2" stroke-linecap="round"/>

  <!-- Beak -->
  <path d="M 93 88 L 100 98 L 107 88 Z" fill="#f4a261" stroke="#e08e3a" stroke-width="1"/>

  <!-- Wings - one raised as if typing -->
  <path d="M 50 115 Q 35 130 45 155 Q 55 145 60 130 Z" fill="#2a90d0" opacity="0.8"/>
  <path d="M 150 110 Q 170 100 165 120 Q 155 130 145 125 Z" fill="#2a90d0" opacity="0.8"/>

  <!-- Laptop / keyboard in front -->
  <rect x="60" y="155" width="80" height="8" rx="2" fill="#555" stroke="#444" stroke-width="1"/>
  <rect x="70" y="148" width="60" height="8" rx="1" fill="#666" stroke="#555" stroke-width="0.5"/>
  <!-- Keyboard keys -->
  <rect x="72" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="79" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="86" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="93" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="100" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="107" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="114" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <rect x="121" y="157" width="5" height="4" rx="0.5" fill="#888"/>
  <!-- Screen -->
  <rect x="72" y="149" width="56" height="6" rx="0.5" fill="#a8d8ff" opacity="0.6">
    <animate attributeName="fill" values="#a8d8ff;#88c8f8;#a8d8ff" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Feet -->
  <path d="M 80 175 L 75 188 M 80 175 L 80 188 M 80 175 L 85 188" stroke="#f4a261" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 120 175 L 115 188 M 120 175 L 120 188 M 120 175 L 125 188" stroke="#f4a261" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Feather detail lines on belly -->
  <path d="M 85 130 Q 100 135 115 130" fill="none" stroke="#c8e0f8" stroke-width="1" opacity="0.5"/>
  <path d="M 82 140 Q 100 145 118 140" fill="none" stroke="#c8e0f8" stroke-width="1" opacity="0.5"/>
  <path d="M 85 150 Q 100 155 115 150" fill="none" stroke="#c8e0f8" stroke-width="1" opacity="0.5"/>
</svg>
